name: 构建 APK

# 手动触发，或推送非文档改动时自动构建
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'

jobs:
  build:
    runs-on: ubuntu-latest
    name: 构建 UiOvpn23 Release APK
    steps:
      - name: 启用 debug 签名（无需密钥即可出可安装包）
        run: |
          mkdir -p ~/.gradle
          echo -e "icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx2048M" > ~/.gradle/gradle.properties

      - name: 检出代码（含 cpp 子模块）
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: 安装 JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'gradle'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 构建
        run: ./gradlew assembleUiOvpn23Release

      - name: 列出产物（便于排查命名）
        run: |
          echo "── APK 文件 ──"
          find main/build/outputs/apk -name "*.apk" -exec ls -la {} \; 2>/dev/null || echo "（未找到 apk）"

      - name: 上传 APK（找不到就报错，不静默通过）
        uses: actions/upload-artifact@v4
        with:
          name: hibu-vpn-android-apk
          path: main/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
